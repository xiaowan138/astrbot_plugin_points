name: astrbot_plugin_points
display_name: 群积分签到系统
logo: logo.png
short_desc: 签到、积分、任务、成就、赛季榜、抽奖与商店一体化群玩法
desc: 测试版（Beta）| 仍在测试的插件，可能存在 bug，请先在小范围群内试用，
      勿直接在正式群大规模启用。功能：每日签到（连续加成/里程碑/日历）、
      积分排行榜、周/月赛季榜与结算奖励（支持自动结算与通胀回收）、
      积分抽奖（每日上限/自定义奖池/保底）、每日任务、发言赚积分、
      成就系统、积分商店与兑换核销（可上下架/兑换码有效期）、积分赠送
      与流水分页；管理员可在群内加/扣/设定积分、补签到、重置、拉黑、
      核销、结算，全部操作留审计日志。内置 Web 管理页面，可配置一切
      参数并一键导出数据备份。
