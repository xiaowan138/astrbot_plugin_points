name: astrbot_plugin_points
display_name: 群积分签到系统
logo: logo.png
short_desc: 每日签到、积分排行榜、积分抽奖与积分商店
desc: 测试版（Beta）| 仍在测试的插件，可能存在 bug，请先在小范围群内试用，
      勿直接在正式群大规模启用。功能：每日签到领积分（含连续加成与
      里程碑奖励）、积分排行榜、积分抽奖（可设每日次数上限）、积分商店兑换、
      个人背包、积分赠送；管理员可在群内直接加分/扣分/补签到/重置用户。内置
      Web 管理页面，可在 AstrBot 仪表盘内配置签到奖励、抽奖、商店、白名单、
      超级管理员与图片卡片字体。
